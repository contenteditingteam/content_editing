<div class="page-hero"><div class="container"><h1>Customer Reviews</h1><p>Every review here was written by a customer whose order has been completed.</p></div></div>

<section class="dash"><div class="container">
  <div id="r-summary" style="text-align:center;margin-bottom:30px;min-height:96px"></div>
  <div class="grid g3" id="r-list" style="min-height:70vh;align-content:start"><p class="hint" style="grid-column:1/-1">Loading reviews…</p></div>

<script src="config.js"></script>
<script src="reviews-data.js"></script>
<script src="reviews-ui.js"></script>
<script src="script.js"></script>
<script>
(async () => {
  const { loadReviews, card, stars } = CEReviews;
  const list = document.getElementById("r-list"), sum = document.getElementById("r-summary");
  const { real, shown } = await loadReviews(100);
  if (!shown.length) {
    list.innerHTML = '<p class="hint" style="grid-column:1/-1">No reviews yet. Reviews appear here after customers complete an order and share their experience.</p>';
    return;
  }
  if (real.length) {
    const avg = real.reduce((t, x) => t + x.rating, 0) / real.length;
    sum.innerHTML = '<div class="stars" style="font-size:2rem">' + stars(Math.round(avg)) + '</div><b style="font-size:1.4rem">' + avg.toFixed(1) + ' out of 5</b><div class="hint" style="margin-top:4px">from ' + real.length + ' customer review' + (real.length === 1 ? "" : "s") + '</div>';
  } else {
    sum.innerHTML = '<div class="hint">Preview mode: sample cards are only visible on your own computer.</div>';
  }
  list.innerHTML = shown.map(card).join("");
})();
</script>
