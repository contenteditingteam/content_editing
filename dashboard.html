<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dashboard | Content Editing</title>
<meta name="robots" content="noindex">
<script src="/consent.js" defer></script><link rel="icon" href="images/logo-sm.webp"><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="dashboard.css">
</head>
<body class="app">
<aside class="sb" id="sb" aria-label="Dashboard menu">
  <div class="sb-card"><b id="who">Loading…</b><span class="mail" id="mail"></span><span class="role" id="role"></span></div>
  <nav id="nav" aria-label="Dashboard"></nav>
  <div class="sb-foot"><a href="index.html">← Back to website</a></div>
</aside>
<div class="sb-scrim" id="scrim"></div>
<div class="app-main">
  <header class="topbar">
    <button class="burger" id="burger" aria-label="Open menu">☰</button>
    <a class="brand" href="index.html"><img src="images/logo-sm.webp" alt="Content Editing logo"><span>Content Editing</span></a><span class="hello" id="hello"></span>
    <div class="spacer"></div>
    <button class="signout" id="logout" type="button"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4M16 17l5-5-5-5M21 12H9"/></svg>Sign Out</button>
  </header>
  <main class="app-content" id="view"><p>Loading your dashboard…</p></main>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="auth.js"></script>
<script src="script.js"></script>
<script>
(async () => {
  const user = await getUser();
  if (!user) return location.replace("login.html");
  const { data: me } = await sb.from("profiles").select("*").eq("id", user.id).single();
  if (!me) { await sb.auth.signOut(); return location.replace("login.html"); }

  $("#who").textContent = me.full_name || me.email;
  $("#role").textContent = me.role;
  $("#mail").textContent = me.email;
  { const hr = new Date().getHours(); $("#hello").textContent = (hr < 12 ? "Good morning" : hr < 18 ? "Good afternoon" : "Good evening") + ", " + String(me.full_name || me.email).split(" ")[0]; }
  $("#logout").onclick = async (e) => { e.preventDefault(); await sb.auth.signOut(); location.replace("login.html"); };

  const SERVICES = ["Academic editing", "Business editing", "Proofreading", "Book editing", "Same-day editing", "Rewriting", "ESL editing"];
  const STATUS = ["new", "assigned", "in_progress", "completed", "cancelled"];
  const view = $("#view");
  const fmt = (d) => new Date(d).toLocaleDateString();
  const opts = (list, cur) => list.map((v) => `<option value="${esc(v)}" ${v === cur ? "selected" : ""}>${esc(v.replace("_", " "))}</option>`).join("");
  const table = (heads, rows) => `<div class="table-wrap"><table><thead><tr>${heads.map((h) => `<th>${h}</th>`).join("")}</tr></thead><tbody>${rows.join("") || `<tr><td colspan="${heads.length}">Nothing here yet.</td></tr>`}</tbody></table></div>`;
  const note = (el, text, ok) => { el.hidden = false; el.className = "alert " + (ok ? "ok" : "err"); el.textContent = text; };
  const chip = (s) => `<span class="chip ${esc(s)}">${esc(s.replace("_", " "))}</span>`;

  const CUST = "Customer file uploading", EDIT = "Editor file uploading";
  const PLANS = [
    ["academic-5", "5-day academic editing"], ["academic-2", "2-day academic editing"], ["academic-1", "1-day academic editing"],
    ["proof-5", "5-day proofreading"], ["proof-2", "2-day proofreading"], ["proof-1", "1-day proofreading"],
    ["business-3", "3-day business editing"], ["business-1", "1-day business editing"],
    ["rush-4h", "4-hour editing"], ["rush-2h", "2-hour editing"], ["dev-14", "Developmental editing (14 days)"], ["rewrite-3", "3-day rewriting"],
  ];
  const money = (n, cur = "USD") => (cur === "INR" ? "₹" + Math.round(n || 0).toLocaleString("en-IN") : "$" + Number(n || 0).toFixed(2));
  const fileName = (p) => String(p || "").split("/").pop().replace(/^\d+-/, "");
  const safeName = (n) => n.replace(/[^\w.\-]+/g, "_");
  const loadScript = (src) => new Promise((ok, no) => { const s = document.createElement("script"); s.src = src; s.onload = ok; s.onerror = () => no(new Error("Could not load " + src)); document.head.appendChild(s); });
  const dlBtn = (bucket, path, label) => path ? `<button class="btn btn-ghost btn-sm" data-dl="${esc(bucket)}|${esc(path)}" title="${esc(fileName(path))}">${label}</button>` : "";

  async function countWords(file) {
    const ext = file.name.split(".").pop().toLowerCase();
    let text = "";
    if (ext === "txt" || ext === "md") text = await file.text();
    else if (ext === "docx") {
      if (!window.JSZip) await loadScript("https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js");
      const zip = await JSZip.loadAsync(await file.arrayBuffer());
      const xml = await zip.file("word/document.xml").async("string");
      text = xml.replace(/<w:del[ >][\s\S]*?<\/w:del>/g, "").replace(/<w:tab\/>|<w:br\/>|<\/w:p>/g, " ").replace(/<[^>]+>/g, "");
    } else if (ext === "pdf") {
      if (!window.pdfjsLib) await loadScript("https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js");
      pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
      const pdf = await pdfjsLib.getDocument({ data: await file.arrayBuffer() }).promise;
      for (let i = 1; i <= pdf.numPages; i++) text += " " + (await (await pdf.getPage(i)).getTextContent()).items.map((x) => x.str).join(" ");
    } else throw new Error("unsupported");
    return text.split(/\s+/).filter(Boolean).length;
  }

  // ----- reviews: customers write one, managers/admins publish or hide it -----
  const reviewDialog = document.createElement("dialog");
  reviewDialog.id = "rv-dlg";
  reviewDialog.innerHTML = `<form method="dialog" id="rv-form">
    <h3 style="margin-bottom:6px">How was your experience?</h3>
    <p class="hint" style="margin:0 0 10px;text-align:left">Your review will be shown on our site after approval, with your first name and last initial.</p>
    <div id="rv-stars" class="rate" role="radiogroup" aria-label="Rating">${[1, 2, 3, 4, 5].map((n) => `<button type="button" data-s="${n}" aria-label="${n} star${n > 1 ? "s" : ""}">★</button>`).join("")}</div>
    <label for="rv-body">Your review</label><textarea id="rv-body" rows="4" maxlength="1500" placeholder="What did you like? How did the editing help?" required></textarea>
    <div class="alert" id="rv-msg" hidden></div>
    <div class="inline-form" style="margin-top:16px"><button class="btn btn-primary" id="rv-send" type="submit">Submit review</button><button class="btn btn-ghost" id="rv-cancel" type="button">Cancel</button></div>
  </form>`;
  document.body.appendChild(reviewDialog);
  let rvOrder = null, rvRating = 0;
  const paintStars = () => reviewDialog.querySelectorAll("[data-s]").forEach((b) => b.classList.toggle("on", +b.dataset.s <= rvRating));
  reviewDialog.querySelector("#rv-stars").onclick = (e) => { const b = e.target.closest("[data-s]"); if (b) { rvRating = +b.dataset.s; paintStars(); } };
  reviewDialog.querySelector("#rv-cancel").onclick = () => reviewDialog.close();
  reviewDialog.querySelector("#rv-form").onsubmit = async (e) => {
    e.preventDefault();
    const msg = reviewDialog.querySelector("#rv-msg"), btn = reviewDialog.querySelector("#rv-send");
    if (!rvRating) return note(msg, "Please choose a star rating.", false);
    btn.disabled = true;
    const { error } = await sb.from("reviews").insert({ order_id: rvOrder, customer_id: user.id, rating: rvRating, body: reviewDialog.querySelector("#rv-body").value.trim() });
    btn.disabled = false;
    if (error) return note(msg, /duplicate|unique/i.test(error.message) ? "You have already reviewed this order." : error.message, false);
    reviewDialog.close(); document.dispatchEvent(new Event("orders-changed"));
  };

  async function messagesPanel() {
    const { data } = await sb.from("contact_messages").select("id,created_at,name,email,topic,message,handled").order("created_at", { ascending: false }).limit(50);
    return `<div class="panel"><h2>Website messages</h2><p class="hint" style="margin-top:0;text-align:left">Messages sent from the Contact page. Reply by email, then mark as handled.</p>${table(["Date", "From", "About", "Message", "Status", ""],
      (data || []).map((m) => `<tr><td>${fmt(m.created_at)}</td><td>${esc(m.name)}<br><a href="mailto:${esc(m.email)}">${esc(m.email)}</a></td><td>${esc(m.topic)}</td><td style="max-width:340px;white-space:pre-wrap">${esc(m.message)}</td>
        <td>${m.handled ? '<span class="chip completed">handled</span>' : '<span class="chip new">new</span>'}</td>
        <td><button class="btn btn-ghost btn-sm" data-msg-toggle="${esc(m.id)}|${m.handled ? "reopen" : "done"}">${m.handled ? "Reopen" : "Mark handled"}</button> <button class="btn btn-ghost btn-sm" data-msg-del="${esc(m.id)}">Delete</button></td></tr>`))}</div>`;
  }

  async function reviewsPanel() {
    const { data } = await sb.from("reviews").select("id,created_at,rating,body,display_name,approved").order("created_at", { ascending: false });
    return `<div class="panel"><h2>Customer reviews</h2><p class="hint" style="margin-top:0;text-align:left">Reviews are hidden until you publish them.</p>${table(["Date", "Customer", "Rating", "Review", "Status", ""],
      (data || []).map((r) => `<tr><td>${fmt(r.created_at)}</td><td>${esc(r.display_name)}</td><td><span class="stars">${"★".repeat(r.rating)}</span></td><td style="max-width:360px">${esc(r.body)}</td>
        <td>${r.approved ? '<span class="chip completed">published</span>' : '<span class="chip new">pending</span>'}</td>
        <td><button class="btn btn-ghost btn-sm" data-rv-toggle="${esc(r.id)}|${r.approved ? "hide" : "show"}">${r.approved ? "Hide" : "Publish"}</button> <button class="btn btn-ghost btn-sm" data-rv-del="${esc(r.id)}">Delete</button></td></tr>`))}</div>`;
  }

  // ----- order details: timeline, messages, cancel and revision -----
  const REVISION_DAYS = 7; // keep equal to the 7 days in supabase/phase8.sql (request_revision) and revisionDays in scripts/legal-config.mjs
  const EVENT_TEXT = {
    created: "Order placed", paid: "Payment received", assigned: "Assigned to an editor", in_progress: "Editing started",
    completed: "Edited document delivered", revision: "Revision requested", cancelled: "Order cancelled", refund_done: "Refund processed",
  };
  const ROLE_NAME = { customer: "Customer", editor: "Editor", manager: "Support", admin: "Support" };
  const orderDialog = document.createElement("dialog");
  orderDialog.id = "od-dlg";
  document.body.appendChild(orderDialog);
  orderDialog.addEventListener("click", (e) => { if (e.target === orderDialog) orderDialog.close(); });
  const isStaff = me.role === "admin" || me.role === "manager";

  async function openOrder(id) {
    if (!orderDialog.open) orderDialog.showModal();
    orderDialog.innerHTML = '<p class="hint">Loading…</p>';
    const [{ data: o, error }, { data: events }, { data: msgs }] = await Promise.all([
      sb.from("orders").select("id,created_at,service,word_count,price,currency,payment_status,status,doc_title,completed_at,refund_status,revision_count,customer_id").eq("id", id).single(),
      sb.from("order_events").select("kind,note,created_at").eq("order_id", id).order("created_at"),
      sb.from("order_messages").select("sender_id,sender_role,body,created_at").eq("order_id", id).order("created_at"),
    ]);
    if (error || !o) { orderDialog.innerHTML = '<p class="alert err">Could not open this order.</p>'; return; }
    const mine = o.customer_id === user.id;
    const cancelled = o.status === "cancelled";
    const days = o.completed_at ? (Date.now() - new Date(o.completed_at).getTime()) / 864e5 : 99;
    const canCancel = mine && o.status === "new";
    const canRevise = mine && o.status === "completed" && days <= REVISION_DAYS;
    orderDialog.innerHTML = `
      <div class="od-head"><div><h3>${esc(o.doc_title || o.service)}</h3>
        <p class="hint" style="margin:2px 0 0;text-align:left">${esc(o.service)} · ${esc(o.word_count)} words · ${money(o.price, o.currency)} · ${chip(o.status)} ${o.payment_status === "paid" ? payChip(o) : ""}${o.refund_status ? ` <span class="chip warn">refund ${o.refund_status === "done" ? "processed" : "requested"}</span>` : ""}</p></div>
        <button class="btn btn-ghost btn-sm" type="button" data-od-close>Close</button></div>
      <h4 class="od-h">Progress</h4>
      <ol class="timeline">${(events || []).map((ev) => `<li class="${ev.kind}"><b>${esc(EVENT_TEXT[ev.kind] || ev.kind)}</b><span>${new Date(ev.created_at).toLocaleString()}</span>${ev.note ? `<em>${esc(ev.note)}</em>` : ""}</li>`).join("")}</ol>
      <h4 class="od-h">Messages</h4>
      <div class="thread" id="od-thread">${(msgs || []).map((m) => `<div class="msg ${m.sender_id === user.id ? "me" : ""}"><small>${m.sender_id === user.id ? "You" : esc(ROLE_NAME[m.sender_role] || "Team")} · ${new Date(m.created_at).toLocaleString()}</small><p>${esc(m.body)}</p></div>`).join("") || '<p class="hint" style="text-align:left">No messages yet.</p>'}</div>
      ${cancelled ? "" : `<form id="od-send" class="inline-form"><label class="sr-only" for="od-body">Message</label><input id="od-body" maxlength="2000" placeholder="Write a message about this order" required><button class="btn btn-primary btn-sm" type="submit">Send</button></form>`}
      <div class="alert" id="od-msg" hidden></div>
      ${canRevise ? `<h4 class="od-h">Request a free revision</h4><p class="hint" style="text-align:left;margin:0 0 8px">Available for ${REVISION_DAYS} days after delivery. Say exactly what should change.</p>
        <form id="od-rev"><label class="sr-only" for="od-rev-note">What should change</label><textarea id="od-rev-note" rows="3" minlength="10" maxlength="2000" required></textarea><button class="btn btn-ghost btn-sm" style="margin-top:8px" type="submit">Send revision request</button></form>` : ""}
      ${canCancel ? `<h4 class="od-h">Cancel this order</h4><p class="hint" style="text-align:left;margin:0 0 8px">You can cancel until an editor is assigned.${o.payment_status === "paid" ? " Because you have paid, a refund will be requested and our team will process it." : ""}</p><button class="btn btn-ghost btn-sm" type="button" data-od-cancel>Cancel order</button>` : ""}
      ${isStaff && o.refund_status === "requested" ? `<h4 class="od-h">Refund</h4><p class="hint" style="text-align:left;margin:0 0 8px">Refund the customer in Razorpay first, then mark it done here.</p><button class="btn btn-primary btn-sm" type="button" data-od-refund>Mark refund as processed</button>` : ""}`;
    const th = orderDialog.querySelector("#od-thread"); th.scrollTop = th.scrollHeight;
    const msg = orderDialog.querySelector("#od-msg");
    const refresh = () => { document.dispatchEvent(new Event("orders-changed")); return openOrder(id); };
    orderDialog.querySelector("[data-od-close]").onclick = () => orderDialog.close();
    const send = orderDialog.querySelector("#od-send");
    if (send) send.onsubmit = async (e) => {
      e.preventDefault();
      const b = send.querySelector("button"); b.disabled = true;
      const { error } = await sb.from("order_messages").insert({ order_id: id, body: orderDialog.querySelector("#od-body").value.trim() });
      b.disabled = false;
      if (error) return note(msg, error.message, false);
      openOrder(id);
    };
    const rev = orderDialog.querySelector("#od-rev");
    if (rev) rev.onsubmit = async (e) => {
      e.preventDefault();
      const { error } = await sb.rpc("request_revision", { p_order: id, p_note: orderDialog.querySelector("#od-rev-note").value });
      if (error) return note(msg, error.message, false);
      refresh();
    };
    const cb = orderDialog.querySelector("[data-od-cancel]");
    if (cb) cb.onclick = async () => {
      if (!confirm("Cancel this order?")) return;
      const { error } = await sb.rpc("cancel_order", { p_order: id });
      if (error) return note(msg, error.message, false);
      refresh();
    };
    const rf = orderDialog.querySelector("[data-od-refund]");
    if (rf) rf.onclick = async () => {
      const { error } = await sb.from("orders").update({ refund_status: "done" }).eq("id", id);
      if (error) return note(msg, error.message, false);
      refresh();
    };
  }
  const detailsBtn = (o) => `<button class="btn btn-ghost btn-sm" data-od="${esc(o.id)}">Details</button>`;

  view.addEventListener("click", async (e) => {
    const odb = e.target.closest("[data-od]");
    if (odb) return openOrder(odb.dataset.od);
    const mt = e.target.closest("[data-msg-toggle]");
    if (mt) {
      const [id, act] = mt.dataset.msgToggle.split("|");
      const { error } = await sb.from("contact_messages").update({ handled: act === "done" }).eq("id", id);
      if (error) return alert(error.message);
      return location.reload();
    }
    const md = e.target.closest("[data-msg-del]");
    if (md) {
      if (!confirm("Delete this message permanently?")) return;
      const { error } = await sb.from("contact_messages").delete().eq("id", md.dataset.msgDel);
      if (error) return alert(error.message);
      return location.reload();
    }
    const rvb = e.target.closest("[data-review]");
    if (rvb) { rvOrder = rvb.dataset.review; rvRating = 0; paintStars(); reviewDialog.querySelector("#rv-body").value = ""; reviewDialog.querySelector("#rv-msg").hidden = true; reviewDialog.showModal(); return; }
    const tg = e.target.closest("[data-rv-toggle]");
    if (tg) {
      const [id, act] = tg.dataset.rvToggle.split("|");
      const { error } = await sb.from("reviews").update({ approved: act === "show" }).eq("id", id);
      if (error) return alert(error.message);
      return location.reload();
    }
    const rd = e.target.closest("[data-rv-del]");
    if (rd) {
      if (!confirm("Delete this review permanently?")) return;
      const { error } = await sb.from("reviews").delete().eq("id", rd.dataset.rvDel);
      if (error) return alert(error.message);
      return location.reload();
    }
    const pay = e.target.closest("[data-pay]");
    if (pay) {
      const orderId = pay.dataset.pay;
      pay.disabled = true; pay.textContent = "Opening…";
      const reset = () => { pay.disabled = false; pay.textContent = "Pay now"; };
      const { data: p, error: pErr } = await sb.functions.invoke("payments", { body: { action: "create", order_id: orderId } });
      if (pErr || !p || p.error) { reset(); console.error(pErr); return alert((p && p.error) || "Could not start the payment. Please try again."); }
      if (p.paid) return location.reload();
      try { if (!window.Razorpay) await loadScript("https://checkout.razorpay.com/v1/checkout.js"); }
      catch { reset(); return alert("Could not load the payment window. Check your connection."); }
      new Razorpay({
        key: p.key_id, amount: p.amount, currency: p.currency, order_id: p.razorpay_order_id,
        name: "Content Editing", description: p.description,
        prefill: { name: me.full_name || "", email: me.email },
        theme: { color: "#0b3a7a" },
        modal: { ondismiss: reset },
        handler: async (r) => {
          const { data: c, error: cErr } = await sb.functions.invoke("payments", { body: { action: "confirm", order_id: orderId, ...r } });
          if (cErr || !c || c.error) alert("Payment received but not confirmed yet. It will update shortly; if it does not, contact us.");
          location.reload();
        },
      }).open();
      return;
    }
    const rc = e.target.closest("[data-verify]");
    if (rc) {
      rc.disabled = true; rc.textContent = "Checking…";
      const { error } = await sb.functions.invoke("verify-order", { body: { order_id: rc.dataset.verify } });
      if (error) { rc.disabled = false; rc.textContent = "Re-check"; return alert("Could not verify this order automatically."); }
      return location.reload();
    }
    const b = e.target.closest("[data-dl]"); if (!b) return;
    const [bucket, ...rest] = b.dataset.dl.split("|");
    const { data, error } = await sb.storage.from(bucket).createSignedUrl(rest.join("|"), 60, { download: fileName(rest.join("|")) });
    if (error) return alert(error.message);
    window.open(data.signedUrl, "_blank");
  });

  view.addEventListener("change", async (e) => {
    const id = e.target.dataset.up; if (!id || !e.target.files[0]) return;
    const f = e.target.files[0];
    if (f.size > 20 * 1024 * 1024) return alert("File is too large (max 20 MB).");
    e.target.disabled = true;
    const path = `${user.id}/${Date.now()}-${safeName(f.name)}`;
    const up = await sb.storage.from(EDIT).upload(path, f);
    if (up.error) { e.target.disabled = false; return alert(up.error.message); }
    const { error } = await sb.from("orders").update({ result_path: path, status: "completed" }).eq("id", id);
    if (error) { e.target.disabled = false; return alert(error.message); }
    location.reload();
  });

  async function loadOrders() {
    const { data, error } = await sb.from("orders")
      .select("id,created_at,service,word_count,price,currency,rush,plan,verified_at,verify_note,payment_status,paid_at,certificate_no,doc_title,file_path,file_paths,result_path,instructions,status,editor_id,customer:profiles!orders_customer_id_fkey(email,full_name),editor:profiles!orders_editor_id_fkey(email,full_name)")
      .order("created_at", { ascending: false });
    if (error) console.error(error);
    return data || [];
  }

  /* ---------- customer ---------- */
  // Quote settings: change these numbers to change the quote form.
  const PRICING = {
    RUSH_MULT: 2,              // rush delivery multiplies the price by this
    INR_RATE: 85,              // 1 US dollar = this many rupees
    MAX_FILES: 5,
    MAX_MB: 20,
    EXTRA_HOURS_PER_10K: 24,   // extra delivery time for every additional 10,000 words
    HOURS: {                   // base delivery time of each plan, in hours
      "academic-5": 120, "academic-2": 48, "academic-1": 24, "proof-5": 120, "proof-2": 48, "proof-1": 24,
      "business-3": 72, "business-1": 24, "rush-4h": 4, "rush-2h": 2, "dev-14": 336, "rewrite-3": 72,
    },
  };
  const isRushPlan = (id) => id.startsWith("rush-");
  const roundPrice = (p, c) => (c === "INR" ? Math.round(p) : Math.round(p * 100) / 100);
  const duration = (h) => (h < 24 ? `${h} hour${h > 1 ? "s" : ""}` : `${Math.ceil(h / 24)} day${Math.ceil(h / 24) > 1 ? "s" : ""}`);
  const filesOf = (o) => (o.file_paths && o.file_paths.length ? o.file_paths : o.file_path ? [o.file_path] : []);
  const priceCell = (o) => money(o.price, o.currency) + (o.verified_at ? ' <span title="Counted and priced by our system">✓</span>' : ` <span class="chip warn" title="${esc(o.verify_note || "Being checked")}">${o.verify_note ? "to be confirmed" : "checking…"}</span>`);
  const payChip = (o) => o.payment_status === "paid" ? '<span class="chip completed">paid</span>' : '<span class="chip new">unpaid</span>';
  const payCell = (o) => o.payment_status === "paid" ? payChip(o)
    : o.verified_at ? `<button class="btn btn-primary btn-sm" data-pay="${esc(o.id)}">Pay now</button>` : '<span class="chip new">awaiting check</span>';

  /* ---------- shell: routing, orders list UI ---------- */
  const head = (title, sub = "", action = "") => `<div class="ph"><div><h1>${esc(title)}</h1>${sub ? `<p>${esc(sub)}</p>` : ""}</div>${action}</div>`;
  const dshort = (d) => new Date(d).toLocaleDateString(undefined, { month: "short", day: "numeric", year: "numeric" });
  const shortId = (o) => "ORD-" + String(o.id).replace(/-/g, "").slice(0, 6).toUpperCase();
  const idCell = (o) => `<button class="oid" type="button" data-od="${esc(o.id)}">${shortId(o)}</button>`;
  const isOpen = (o) => o.status !== "completed" && o.status !== "cancelled";
  const deadlineOf = (o) => { // same delivery-time rules as the quote form (PRICING)
    let hours = PRICING.HOURS[o.plan];
    if (!hours || o.payment_status !== "paid") return null;
    if (hours >= 24) hours += Math.floor(Math.max(0, (o.word_count || 1) - 1) / 10000) * PRICING.EXTRA_HOURS_PER_10K;
    if (o.rush) hours = Math.max(4, Math.ceil(hours / 2));

  };
  const deadlineCell = (o) => {
    const d = deadlineOf(o);
    if (!d) return '<span class="dim">—</span>';
    return `<span class="${isOpen(o) && d < new Date() ? "late" : ""}">${dshort(d)}</span>`;

  const GROUPS = {
    all: ["All", () => true],
    active: ["Active", isOpen],

  const countUp = () => view.querySelectorAll(".stat strong").forEach((el) => { // numbers count up on load

    const n = +t, t0 = performance.now();

  // Stat cards, filters, sortable + paged table. cols: [{ h, key?, val?, cls?, td }]
  // queue:true gives the manager/editor "job queue" look (big stat cards, status select, search, overdue toggle).
  function ordersUI({ title, sub, action = "", orders, cols, staff = false, queue = false }) {

    const isLate = (o) => { const d = deadlineOf(o); return !!d && isOpen(o) && d < new Date(); };
    const count = (k) => orders.filter(GROUPS[k][1]).length;
    const keys = Object.keys(GROUPS).filter((k) => k !== "cancelled" || count(k));

      user: '<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-7 8-7s8 3 8 7"/>',

      <span class="meter" aria-hidden="true"><i style="--p:${orders.length ? Math.round((n / orders.length) * 100) : 0}%"></i></span></div>`;
    const stats = queue
      ? [["Paid", orders.filter((o) => o.payment_status === "paid").length, "pct"], ["In Progress", count("progress"), "spin"], ["Delivered", count("done"), "ok"]]
      : [["Active Orders", count("active"), "jobs"], ["In Progress", count("progress"), "spin"], ["Completed", count("done"), "ok"]];
    if (staff) stats.push(["Needs assignment", orders.filter((o) => o.payment_status === "paid" && !o.editor_id && o.status === "new").length, "user"]);
    const late = orders.filter(isLate).length;
    const top = queue
      ? `<div class="ph"><div><h1>${esc(title)}</h1><p>${esc(sub)}</p></div><div class="badges"><div class="bd"><small>TOTAL</small><b>${orders.length}</b></div><div class="bd red"><small>OVERDUE</small><b>${late}</b></div></div></div>`
      : head(title, sub, action);
    const controls = queue
      ? `<div class="qbar"><h2>Job Queue</h2><div class="qctl">
          <label>Status <select data-status-f><option value="all">All</option>${STATUS.map((s) => `<option value="${s}">${s.replace("_", " ")}</option>`).join("")}</select></label>
          <label>Search <input type="search" data-q placeholder="Job ID or customer…" autocomplete="off"></label>

          <span class="cnt" data-cnt></span>${sel(st.per)}${pager}</div></div>`
      : `<div class="pills" role="group" aria-label="Filter orders">${keys.map((k) => `<button type="button" class="pill" data-f="${k}">${GROUPS[k][0]} (${count(k)})</button>`).join("")}</div>
         <div class="tb"><span class="cnt" data-cnt></span>${sel(st.per)}${pager}</div>`;
    view.innerHTML = `${top}<div class="stats bigs">${stats.map((s) => card(...s)).join("")}</div>${controls}<div class="table-wrap" id="ot"></div>`;
    const paint = () => {
      let list = orders.filter((o) => (queue ? st.status === "all" || o.status === st.status : GROUPS[st.f][1](o)) && (!st.late || isLate(o)) && (!st.q || hay(o).includes(st.q)));
      const col = cols.find((c) => c.key === st.sort);
      if (col) list.sort((a, b) => { const x = col.val(a), y = col.val(b); if (x == null && y == null) return 0; if (x == null) return 1; if (y == null) return -1; return (x > y ? 1 : x < y ? -1 : 0) * st.dir; });
      const pages = Math.max(1, Math.ceil(list.length / st.per));
      st.page = Math.min(st.page, pages);
      const start = (st.page - 1) * st.per, rows = list.slice(start, start + st.per);
      view.querySelector("[data-cnt]").textContent = `${list.length ? start + 1 : 0}-${Math.min(list.length, start + st.per)} of ${list.length}`;
      view.querySelector('[data-pg="-1"]').disabled = st.page <= 1;
      view.querySelector('[data-pg="1"]').disabled = st.page >= pages;
      view.querySelectorAll("[data-f]").forEach((b) => b.classList.toggle("on", b.dataset.f === st.f));
      const tg = view.querySelector("[data-late]"); if (tg) tg.classList.toggle("on", st.late);
      view.querySelector("#ot").innerHTML = `<table><thead><tr>${cols.map((c) => `<th class="${c.key ? "s" + (c.key === st.sort ? (st.dir > 0 ? " asc" : " desc") : "") : ""} ${c.cls || ""}" ${c.key ? `data-sort="${c.key}"` : ""}>${c.h}</th>`).join("")}</tr></thead>
        <tbody>${rows.map((o) => `<tr>${cols.map((c) => `<td class="${c.cls || ""}">${c.td(o)}</td>`).join("")}</tr>`).join("") || `<tr><td class="empty" colspan="${cols.length}">No orders here yet.</td></tr>`}</tbody></table>`;
    };
    view._click = (e) => {
      const f = e.target.closest("[data-f]"), s = e.target.closest("[data-sort]"), p = e.target.closest("[data-pg]"), l = e.target.closest("[data-late]");
      if (f) { st.f = f.dataset.f; st.page = 1; return paint(); }
      if (l) { st.late = !st.late; st.page = 1; return paint(); }
      if (s) { const k = s.dataset.sort; st.dir = st.sort === k ? -st.dir : (k === "created_at" || k === "deadline" ? -1 : 1); st.sort = k; return paint(); }
      if (p) { st.page += +p.dataset.pg; return paint(); }
    };
    view._change = (e) => {
      if (e.target.matches("[data-per]")) { st.per = +e.target.value; st.page = 1; paint(); }
      else if (e.target.matches("[data-status-f]")) { st.status = e.target.value; st.page = 1; paint(); }
    };
    view._input = (e) => { if (e.target.matches("[data-q]")) { st.q = e.target.value.trim().toLowerCase(); st.page = 1; paint(); } };
    paint();
    countUp();
  }

  async function analyticsView() {
    const orders = await loadOrders();
    const paid = orders.filter((o) => o.payment_status === "paid");
    const sum = (list, cur) => list.filter((o) => o.currency === cur).reduce((s, o) => s + Number(o.price || 0), 0);
    const by = new Map();
    for (const o of orders) {
      const k = String(o.service).replace(/ \+ rush$/, ""), r = by.get(k) || { n: 0, w: 0, usd: 0, inr: 0 };
      r.n++; r.w += o.word_count || 0;
      if (o.payment_status === "paid") { if (o.currency === "INR") r.inr += Number(o.price || 0); else r.usd += Number(o.price || 0); }
      by.set(k, r);
    }
    const months = [];
    for (let i = 5; i >= 0; i--) { const d = new Date(); d.setDate(1); d.setMonth(d.getMonth() - i); months.push({ y: d.getFullYear(), m: d.getMonth(), label: d.toLocaleDateString(undefined, { month: "short", year: "numeric" }), n: 0 }); }
    for (const o of orders) { const d = new Date(o.created_at), mm = months.find((x) => x.y === d.getFullYear() && x.m === d.getMonth()); if (mm) mm.n++; }
    const max = Math.max(1, ...months.map((x) => x.n));
    const words = orders.reduce((s, o) => s + (o.word_count || 0), 0);
    view.innerHTML = head("Analytics", "A summary of your orders and revenue.")
      + `<div class="stats">${[["Total orders", orders.length], ["Paid orders", paid.length], ["Revenue (USD)", money(sum(paid, "USD"))], ["Revenue (INR)", money(sum(paid, "INR"), "INR")], ["Words edited", words.toLocaleString()]].map(([l, n]) => `<div class="stat"><small>${l}</small><strong>${n}</strong></div>`).join("")}</div>
      <div class="panel"><h2>Orders per month</h2>${months.map((x) => `<div class="bar-row"><span>${x.label}</span><div class="bar"><i style="width:${Math.round((x.n / max) * 100)}%"></i></div><b>${x.n}</b></div>`).join("")}</div>
      <div class="panel"><h2>By service</h2>${table(["Service", "Orders", "Words", "Paid revenue"], [...by.entries()].sort((a, b) => b[1].n - a[1].n).map(([k, r]) => `<tr><td>${esc(k)}</td><td>${r.n}</td><td>${r.w.toLocaleString()}</td><td>${[r.usd ? money(r.usd) : "", r.inr ? money(r.inr, "INR") : ""].filter(Boolean).join(" + ") || "—"}</td></tr>`))}</div>`;

        <form id="pf-pass" class="inline-form"><label class="sr-only" for="pf-p">New password</label><input id="pf-p" type="password" minlength="8" autocomplete="new-password" placeholder="New password (min 8 characters)" required><button class="btn btn-ghost btn-sm" type="submit">Change password</button></form>
        <div class="alert" id="pf-msg2" hidden></div>
        <div class="inline-form" style="margin-top:18px">
          <button class="btn btn-primary btn-sm" type="button" id="pf-out">Log out</button>
          <button class="btn btn-ghost btn-sm" type="button" id="pf-all">Log out on all devices</button>
        </div>
      </div>

      ${isCustomer ? `<div class="panel"><h2>Delete my account</h2>
        <p class="hint" style="text-align:left;margin:0 0 10px">This permanently removes your account, your uploaded and edited files, your orders and your reviews. It cannot be undone. Orders being edited must be delivered first. See our <a href="privacy.html">Privacy policy</a>.</p>
        <form id="pf-del" class="inline-form"><label class="sr-only" for="pf-d">Type DELETE to confirm</label><input id="pf-d" autocomplete="off" placeholder="Type DELETE to confirm"><button class="btn btn-ghost btn-sm" type="submit">Delete my account</button></form>
        <div class="alert" id="pf-msg3" hidden></div></div>` : ""}`;

    $("#pf-name").onsubmit = async (e) => {
      e.preventDefault();
      const m = $("#pf-msg1");
      const { error } = await sb.rpc("update_my_name", { p_name: $("#pf-n").value });
      if (error) return note(m, error.message, false);
      me.full_name = $("#pf-n").value.trim();
      $("#who").textContent = me.full_name || me.email; $("#pf-title").textContent = me.full_name;
      view.querySelector(".avatar").textContent = initials(me.full_name);
      note(m, "Name saved.", true);
    };
    $("#pf-pass").onsubmit = async (e) => {
      e.preventDefault();
      const m = $("#pf-msg2");
      const { error } = await sb.auth.updateUser({ password: $("#pf-p").value });
      if (error) return note(m, error.message, false);
      $("#pf-p").value = ""; note(m, "Password changed.", true);
    };
    $("#pf-out").onclick = async () => { await sb.auth.signOut(); location.replace("login.html"); };
    $("#pf-all").onclick = async () => { await sb.auth.signOut({ scope: "global" }); location.replace("login.html"); };
    const del = $("#pf-del");
    if (del) del.onsubmit = async (e) => {
      e.preventDefault();
      const m = $("#pf-msg3");
      if ($("#pf-d").value.trim() !== "DELETE") return note(m, "Type DELETE (in capital letters) to confirm.", false);
      if (!confirm("Delete your account and all your files permanently?")) return;
      const { data, error } = await sb.functions.invoke("delete-account");
      let text = data && data.error;
      if (error && !text) { try { text = (await error.context.json()).error; } catch { text = "Could not delete the account. Please contact us."; } }
      if (text) return note(m, text, false);
      await sb.auth.signOut();
      location.replace("index.html");
    };
  }

  window.addEventListener("hashchange", route);
  await route();
})();
</script>
</body>
</html>
